name: ci
on: [push, pull_request]
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # setup-homebrew registra este checkout como el tap frederickknight/tap
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install frederickknight/tap/git-park
      - run: brew test frederickknight/tap/git-park
      - run: git park help
